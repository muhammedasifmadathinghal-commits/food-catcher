<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fruit Catcher</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #171025;

        font-family: Arial, sans-serif;
      }

      .game {
        width: 700px;
        max-width: 95%;

        overflow: hidden;

        border-radius: 25px;

        background: #8edfff;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .top {
        display: flex;

        justify-content: space-around;
        align-items: center;

        padding: 15px;

        background: white;
      }

      .box {
        text-align: center;
      }

      .box p {
        font-size: 12px;
        color: #777;
      }

      .box h2 {
        color: #222;
      }

      .game-area {
        height: 450px;

        position: relative;

        overflow: hidden;

        background: linear-gradient(#67d9ff, #c9f5ff);
      }

      .sun {
        width: 70px;
        height: 70px;

        position: absolute;

        right: 40px;
        top: 30px;

        border-radius: 50%;

        background: #ffe45c;

        box-shadow: 0 0 35px #ffe45c;
      }

      .cloud {
        width: 120px;
        height: 35px;

        position: absolute;

        border-radius: 30px;

        background: white;

        opacity: 0.8;
      }

      .cloud1 {
        top: 80px;
        left: 40px;
      }

      .cloud2 {
        top: 150px;
        right: 150px;
      }

      .fruit {
        width: 50px;
        height: 50px;

        position: absolute;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 40px;
      }

      .basket {
        width: 110px;
        height: 60px;

        position: absolute;

        left: 50%;
        bottom: 60px;

        transform: translateX(-50%);

        background: #b86628;

        border: 5px solid #703a18;

        border-radius: 10px 10px 35px 35px;

        z-index: 10;
      }

      .basket::before {
        content: "";

        position: absolute;

        left: 10px;
        right: 10px;

        top: 15px;

        height: 7px;

        background: #ffd078;

        box-shadow: 0 18px #ffd078;
      }

      .ground {
        width: 100%;
        height: 65px;

        position: absolute;

        bottom: 0;

        background: linear-gradient(#4dcc5c, #168538);

        border-top: 7px solid #7ce66a;
      }

      .buttons {
        display: flex;

        justify-content: center;

        gap: 10px;

        padding: 15px;

        background: white;
      }

      button {
        padding: 12px 20px;

        border: none;

        border-radius: 12px;

        background: #eee;

        font-weight: bold;

        cursor: pointer;
      }

      button:hover {
        transform: scale(1.05);
      }

      .start {
        background: #7437ff;

        color: white;
      }

      @media (max-width: 600px) {
        .game {
          width: 98%;
        }

        .game-area {
          height: 400px;
        }

        .basket {
          width: 95px;
          height: 55px;
        }
      }
    </style>
  </head>

  <body>
    <div class="game">
      <div class="top">
        <div class="box">
          <p>SCORE</p>

          <h2 id="score">0</h2>
        </div>

        <div class="box">
          <p>LEVEL</p>

          <h2 id="level">1</h2>
        </div>
       

        <div class="box">
          <p>LIVES</p>

          <h2 id="lives">❤️❤️❤️</h2>
        </div>
      </div>

      <div class="game-area" id="gameArea">
        <div class="sun"></div>

        <div class="cloud cloud1"></div>

        <div class="cloud cloud2"></div>

        <div class="basket" id="basket"></div>

        <div class="ground"></div>
      </div>

      <div class="buttons">
        <button id="left">⬅️ LEFT</button>

        <button class="start" id="start">▶ START</button>

        <button id="right">RIGHT ➡️</button>
      </div>
    </div>

    <script>
      const fruits = ["🍎"];

      const fruitList = fruits.map(function (fruit) {
        return fruit;
      });

      let score = 0;

      let level = 1;

      let lives = 3;

      let basketX = 50;

      let gameRunning = false;

      let fruit = null;

      let fruitY = 0;

      let fallTimer;

      let nextFruit;

      const gameArea = document.getElementById("gameArea");

      const basket = document.getElementById("basket");

      const scoreText = document.getElementById("score");

      const levelText = document.getElementById("level");

      const livesText = document.getElementById("lives");

       document.getElementById("left").addEventListener("click", function () {
        moveBasket(-8);
      });

      document.getElementById("right").addEventListener("click", function () {
        moveBasket(8);
      });

      document.getElementById("start").addEventListener("click", function () {
        startGame();
      });

      function updateScreen() {
        scoreText.textContent = score;

        levelText.textContent = level;

        livesText.textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
      }

      function moveBasket(amount) {
        if (gameRunning == false) {
          return;
        }

        basketX = basketX + amount;

        if (basketX < 10) {
          basketX = 10;
        }

        if (basketX > 90) {
          basketX = 90;
        }

        basket.style.left = basketX + "%";
      }

      function removeFruit() {
        if (fruit != null) {
          fruit.remove();

          fruit = null;
        }

        clearInterval(fallTimer);
      }

      function createFruit() {
        if (gameRunning == false) {
          return;
        }

        removeFruit();

        const randomNumber = Math.floor(Math.random() * fruitList.length);

        const selectedFruit = fruitList[randomNumber];

        fruit = document.createElement("div");

        fruit.className = "fruit";

        fruit.textContent = selectedFruit;

        const randomX = Math.random() * 85 + 5;

        fruit.style.left = randomX + "%";

        fruit.style.top = "0px";

        gameArea.appendChild(fruit);

        fruitY = 0;

        const speed = 3 + (level - 1) * 0.3;

        fallTimer = setInterval(function () {
          fruitY = fruitY + speed;

          fruit.style.top = fruitY + "px";

          const fruitBox = fruit.getBoundingClientRect();

          const basketBox = basket.getBoundingClientRect();

          if (
            fruitBox.bottom >= basketBox.top &&
            fruitBox.left < basketBox.right &&
            fruitBox.right > basketBox.left
          ) {
            score = score + 10;

            level = Math.floor(score / 50) + 1;

            updateScreen();

            removeFruit();

            nextFruit = setTimeout(function () {
              createFruit();
            }, 300);

            return;
          }

          if (fruitY > gameArea.clientHeight - 130) {
            lives = lives - 1;

            updateScreen();

            removeFruit();

            if (lives > 0) {
              nextFruit = setTimeout(createFruit, 300);
            } else {
              gameRunning = false;

              alert("Game Over!" + "<br> " + "Your score is " + score);
            }
          }
        }, 20);
      }

      function startGame() {
        clearTimeout(nextFruit);

        removeFruit();

        score = 0;

        level = 1;

        lives = 3;

        basketX = 50;

        gameRunning = true;

        basket.style.left = "50%";

        updateScreen();

        createFruit();
      }

     

      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
          moveBasket(-8);
        }

        if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
          moveBasket(8);
        }
      });

      updateScreen();
    </script>
  </body>
</html>
